{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Ticket Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .login-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .login-hero {
            flex: 1.2;
            background-image: url("{% static 'images/logo.png' %}");
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px;
            color: white;
        }

        .login-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 60%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .login-form-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 40px;
            overflow: visible;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-welcome {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .login-instruction {
            color: #718096;
            font-size: 1rem;
        }

        .form-control {
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .input-group-text {
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            border-right: none;
            color: #a0aec0;
        }

        .input-group .form-control {
            border-left: none;
        }

        .btn-login {
            background: #667eea;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            width: 100%;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }

        @media (max-width: 900px) {
            .login-hero {
                display: none;
            }

            .login-wrapper {
                background: #f5f7fa;
            }

            .login-card {
                background: white;
                padding: 24px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            }
        }

        @media (max-width: 420px) {
            .login-form-container {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-hero">
            <div class="hero-content">
                <i class="fas fa-shield-alt mb-3" style="font-size: 3rem; color: rgba(255,255,255,0.9);"></i>
                <div class="hero-title">Secure Access</div>
                <div class="hero-subtitle">Set a strong new password to protect your account.</div>
            </div>
        </div>

        <div class="login-form-container">
            <div class="login-card">
                <div class="login-header">
                    <h1 class="login-welcome">Reset Password</h1>
                    <p class="login-instruction">Enter the verification code sent to your email and your new password.
                    </p>
                </div>

                <div id="error-message" class="alert alert-danger" style="display: none;"></div>
                <div id="success-message" class="alert alert-success" style="display: none;"></div>

                <form id="reset-password-form">
                    <input type="hidden" id="email">

                    <div class="mb-3">
                        <label for="otp" class="form-label">Verification Code</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                            <input type="text" class="form-control" id="otp" placeholder="000000" required maxlength="6"
                                style="letter-spacing: 2px;">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="new_password"
                                placeholder="Min. 8 characters" required minlength="8">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login">
                        Reset Password
                    </button>

                    <div class="mt-4 text-center">
                        <a href="#" id="back-to-login-link" class="text-decoration-none text-secondary small">Back to
                            Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="{% static 'js/api.js' %}?v=20260210"></script>
    <script src="{% static 'js/auth.js' %}?v=20260210"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Build slug-aware links
        const KNOWN_ROUTES = new Set(['login', 'dashboard', 'tickets', 'admin', 'head', 'projects',
            'notifications', 'forgot-password', 'reset-password', 'onboarding',
            'register', 'api', 'static', 'platform']);
        const _pathParts = window.location.pathname.replace(/^\/+/, '').split('/');
        const _orgSlug = _pathParts[0] && !KNOWN_ROUTES.has(_pathParts[0]) ? _pathParts[0] : null;
        const _loginUrl = _orgSlug ? `/${_orgSlug}/login` : '/';

        // Fix back-to-login href
        const backLink = document.getElementById('back-to-login-link');
        if (backLink) backLink.href = _loginUrl;

        // Get email from URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('email').value = email;
        } else {
            document.getElementById('error-message').textContent = 'Invalid request. Please start from the Forgot Password page.';
            document.getElementById('error-message').style.display = 'block';
        }

        document.getElementById('reset-password-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('new_password').value;
            const emailVal = document.getElementById('email').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const btn = this.querySelector('button[type="submit"]');

            if (!emailVal) {
                errorDiv.textContent = 'Email is missing. Please restart the process.';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';

            try {
                // BUG-FIX: Use api.request so buildEndpoint injects the correct org prefix
                const data = await api.request('/api/auth/reset-password/', {
                    method: 'POST',
                    body: JSON.stringify({ email: emailVal, otp: otp, new_password: newPassword })
                });

                successDiv.textContent = data.message || 'Password reset successfully!';
                successDiv.style.display = 'block';
                // BUG-FIX: redirect to slug-scoped login page
                setTimeout(() => {
                    window.location.href = `${_loginUrl}?reset=success`;
                }, 2000);
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = error.message || 'An error occurred. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Reset Password';
            }
        });
    </script>
</body>

</html>
