{% extends "base.html" %}

{% block title %}Department Management - Admin{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="fas fa-building"></i> Department Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDeptModal">
                <i class="fas fa-plus"></i> Add Department
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div id="departments-list"></div>
            </div>
        </div>
    </div>
</div>

<!-- Add Department Modal -->
<div class="modal fade" id="addDeptModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Department</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="add-dept-form">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Department ID</label>
                        <input type="text" class="form-control" name="id" required>
                        <small class="text-muted">Lowercase, no spaces (e.g., hr, engineering)</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Keywords (comma-separated)</label>
                        <input type="text" class="form-control" name="keywords" 
                               placeholder="bug, feature, technical">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Department</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadDepartments() {
        try {
            const departments = await api.getDepartments();
            renderDepartments(departments);
        } catch (error) {
            showError('Failed to load departments: ' + error.message);
        }
    }
    
    function renderDepartments(departments) {
        const container = document.getElementById('departments-list');
        container.innerHTML = departments.map(dept => `
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h5>${dept.name}</h5>
                            <p class="mb-1"><strong>ID:</strong> ${dept.id}</p>
                            <p class="mb-1"><strong>Email:</strong> ${dept.email}</p>
                            <p class="mb-0"><strong>Keywords:</strong> ${(dept.keywords || []).join(', ')}</p>
                        </div>
                        <div class="col-md-4 text-end">
                            <button class="btn btn-danger" onclick="deleteDepartment('${dept.id}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    document.getElementById('add-dept-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = {
            id: formData.get('id'),
            name: formData.get('name'),
            email: formData.get('email'),
            keywords: formData.get('keywords').split(',').map(k => k.trim()).filter(Boolean)
        };
        
        try {
            await api.addDepartment(data);
            showSuccess('Department added successfully');
            bootstrap.Modal.getInstance(document.getElementById('addDeptModal')).hide();
            e.target.reset();
            loadDepartments();
        } catch (error) {
            showError('Failed to add department: ' + error.message);
        }
    });
    
    async function deleteDepartment(deptId) {
        if (!confirm('Are you sure you want to delete this department?')) return;
        
        try {
            await api.deleteDepartment(deptId);
            showSuccess('Department deleted');
            loadDepartments();
        } catch (error) {
            showError('Failed to delete department: ' + error.message);
        }
    }
    
    document.addEventListener('DOMContentLoaded', loadDepartments);
</script>
{% endblock %}
