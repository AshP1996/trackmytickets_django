<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrackMyTicket{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }

        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .email-header {
            background: linear-gradient(135deg, #4a56e2, #6c63ff);
            padding: 28px 32px;
            text-align: center;
        }

        .email-header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .email-header .subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            margin-top: 4px;
        }

        .email-body {
            padding: 32px;
        }

        .email-body h2 {
            color: #2d3748;
            font-size: 20px;
            margin: 0 0 16px 0;
        }

        .email-body p {
            color: #4a5568;
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 14px 0;
        }

        .info-box {
            background-color: #f7f8fc;
            border-left: 4px solid #4a56e2;
            padding: 16px 20px;
            border-radius: 0 6px 6px 0;
            margin: 20px 0;
        }

        .info-box .label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-box .value {
            font-size: 15px;
            color: #2d3748;
            font-weight: 600;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: #718096;
            font-size: 13px;
        }

        .info-row .value {
            color: #2d3748;
            font-size: 14px;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #4a56e2, #6c63ff);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            margin: 16px 0;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-open {
            background: #ebf5ff;
            color: #2b6cb0;
        }

        .badge-in_progress {
            background: #fefcbf;
            color: #975a16;
        }

        .badge-waiting {
            background: #fed7e2;
            color: #97266d;
        }

        .badge-resolved {
            background: #c6f6d5;
            color: #276749;
        }

        .badge-closed {
            background: #e2e8f0;
            color: #4a5568;
        }

        .badge-low {
            background: #c6f6d5;
            color: #276749;
        }

        .badge-medium {
            background: #fefcbf;
            color: #975a16;
        }

        .badge-high {
            background: #fed7aa;
            color: #c05621;
        }

        .badge-critical {
            background: #fed7d7;
            color: #c53030;
        }

        .otp-code {
            font-size: 36px;
            font-weight: 700;
            color: #4a56e2;
            letter-spacing: 8px;
            text-align: center;
            padding: 20px;
            background: #f7f8fc;
            border-radius: 8px;
            margin: 20px 0;
        }

        .credential-box {
            background: #1a202c;
            color: #e2e8f0;
            padding: 16px 20px;
            border-radius: 6px;
            margin: 16px 0;
            font-family: 'Courier New', monospace;
        }

        .credential-box .cred-label {
            color: #a0aec0;
            font-size: 11px;
            text-transform: uppercase;
        }

        .credential-box .cred-value {
            color: #48bb78;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .email-footer {
            background-color: #f7f8fc;
            padding: 20px 32px;
            text-align: center;
            border-top: 1px solid #edf2f7;
        }

        .email-footer p {
            color: #a0aec0;
            font-size: 12px;
            margin: 0;
            line-height: 1.6;
        }

        .email-footer a {
            color: #4a56e2;
            text-decoration: none;
        }

        .divider {
            border: none;
            border-top: 1px solid #edf2f7;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            vertical-align: top;
        }

        @media (max-width: 600px) {
            .email-body {
                padding: 20px;
            }

            .email-header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div style="padding: 20px 10px; background-color: #f0f2f5;">
        <div class="email-wrapper">
            <div class="email-header">
                <h1>🎫 TrackMyTicket</h1>
                <div class="subtitle">{% block header_subtitle %}Ticket Management System{% endblock %}</div>
            </div>
            <div class="email-body">
                {% block content %}{% endblock %}
            </div>
            <div class="email-footer">
                <p>This is an automated notification from <a href="{{ site_url }}">TrackMyTicket</a>.</p>
                <p>© {{ year }} TrackMyTicket. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>

</html>
